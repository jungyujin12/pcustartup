<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>제작 사이트 관리 | PCU</title>
<style>*{box-sizing:border-box}[hidden]{display:none!important}body{margin:0;background:#f3f7fb;color:#172b42;font-family:"Noto Sans KR","Malgun Gothic",sans-serif}.top{background:#10243e;color:#fff;padding:1rem}.top div{max-width:1240px;margin:auto;display:flex;align-items:center;gap:1rem}.top h1{font-size:1.1rem;margin:0;margin-right:auto}.top a{color:#fff;text-decoration:none;border:1px solid #7890aa;padding:.5rem .75rem;border-radius:7px}.wrap{max-width:1240px;margin:1.5rem auto;padding:0 1rem}.card{background:#fff;border:1px solid #dbe6f0;border-radius:14px;padding:1.2rem;box-shadow:0 6px 20px rgba(20,50,80,.06);margin-bottom:1rem}.notice{background:#eef6ff;border-left:4px solid #0052cc;padding:.8rem 1rem;border-radius:6px;line-height:1.6;font-size:.85rem}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:.75rem;margin:1rem 0}.stat{border:1px solid #dbe6f0;border-radius:10px;padding:.9rem}.stat small{color:#667b90}.stat strong{display:block;font-size:1.35rem;margin-top:.2rem}.toolbar{display:grid;grid-template-columns:1.3fr repeat(4,minmax(125px,.7fr));gap:.6rem;margin:1rem 0}input,select,button{font:inherit;border-radius:7px;padding:.65rem;border:1px solid #bdcbd9;min-width:0}button{background:#0052cc;color:#fff;border:0;font-weight:700;cursor:pointer}button:disabled{opacity:.5}.table-wrap{overflow:auto;border:1px solid #dbe6f0;border-radius:10px}table{width:100%;border-collapse:collapse;min-width:1100px;font-size:.82rem}th{background:#eaf2fb;text-align:left;padding:.7rem;white-space:nowrap}td{padding:.75rem;border-top:1px solid #e6edf4;vertical-align:top;line-height:1.45}.muted{color:#667b90;font-size:.75rem}.pill{display:inline-block;border-radius:999px;padding:.2rem .5rem;background:#eaf2fb;color:#124a84;font-size:.7rem;font-weight:700}.pill.career{background:#fff4db;color:#875900}.pill.final{background:#e8f8ef;color:#11643c}.actions{display:flex;gap:.35rem;flex-wrap:wrap}.actions a,.actions button{font-size:.72rem;padding:.42rem .55rem;text-decoration:none}.actions a{border-radius:6px;background:#10243e;color:#fff}.empty{text-align:center;padding:3rem;color:#667b90}.legacy{display:grid;grid-template-columns:1fr minmax(200px,.8fr) auto;gap:.7rem;align-items:center;padding:.8rem 0;border-bottom:1px solid #e6edf4}.legacy:last-child{border:0}@media(max-width:800px){.stats{grid-template-columns:1fr 1fr}.toolbar{grid-template-columns:1fr 1fr}.legacy{grid-template-columns:1fr}.top div{flex-wrap:wrap}}@media(max-width:480px){.stats,.toolbar{grid-template-columns:1fr}}</style></head>
<body><header class="top"><div><h1>🌐 제작 사이트 관리</h1><a href="admin.html">관리자 화면으로</a></div></header><main class="wrap">
<section class="card"><div class="notice"><strong>창업·취업 제작 결과 통합 관리</strong><br>창업 사이트는 동아리와 연결해 다시 볼 수 있습니다. 취업 포트폴리오는 학생에게 한 번만 전달되며 완성 파일은 보관하지 않고 제작 기록만 표시합니다.</div><div id="status" class="empty">관리자 권한을 확인하고 있습니다.</div><div id="main" hidden>
<div class="stats"><div class="stat"><small>전체 제작</small><strong id="totalCount">0</strong></div><div class="stat"><small>창업 사이트</small><strong id="startupCount">0</strong></div><div class="stat"><small>취업 포트폴리오</small><strong id="careerCount">0</strong></div><div class="stat"><small>최종 확정</small><strong id="finalCount">0</strong></div></div>
<div class="toolbar"><input id="search" placeholder="제목·이름·학번·학과·동아리 검색"><select id="track"><option value="">전체 종류</option><option value="startup">창업</option><option value="career">취업</option></select><select id="year"><option value="">전체 연도</option></select><select id="club"><option value="">전체 동아리</option><option value="__none__">동아리 없음</option></select><select id="sort"><option value="new">최근 제작순</option><option value="old">오래된순</option><option value="title">제목순</option><option value="track">종류순</option></select></div>
<div class="table-wrap"><table><thead><tr><th>제작일</th><th>종류</th><th>제목·파일명</th><th>학생·동아리</th><th>연도</th><th>상태</th><th>보관 상태</th><th>관리</th></tr></thead><tbody id="body"></tbody></table></div></div></section>
<section id="legacyCard" class="card" hidden><h2 style="font-size:1rem;margin-top:0">동아리가 지정되지 않은 기존 창업 사이트</h2><p class="muted">동아리 연결 기능 도입 전에 만든 창업 사이트만 표시됩니다. 취업 결과는 동아리를 지정하지 않습니다.</p><div id="legacyList"></div></section></main>
<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";import {getAuth,onAuthStateChanged} from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";import {getFirestore,collection,getDocs,doc,writeBatch,deleteField,serverTimestamp} from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
const app=initializeApp({apiKey:"AIzaSyBgZ5pqslhIV7SVTgt3ZSc_ZGGtORM-P-A",authDomain:"pcu-startup.firebaseapp.com",projectId:"pcu-startup",storageBucket:"pcu-startup.firebasestorage.app",messagingSenderId:"47845163622",appId:"1:47845163622:web:789eaef6966e9cf28be3a7"});const db=getFirestore(app),auth=getAuth(app),admins=['jyj2315@gmail.com','bridge0610@pcu.ac.kr'];let clubs=[],jobs=[],careerRecords=[];const $=id=>document.getElementById(id),esc=value=>{const span=document.createElement('span');span.textContent=String(value??'');return span.innerHTML},date=value=>value?.toDate?.().toLocaleString('ko-KR',{dateStyle:'short',timeStyle:'short'})||'-';
onAuthStateChanged(auth,user=>{if(!user||!admins.includes(user.email||'')){$('status').innerHTML='관리자 로그인이 필요합니다. <a href="admin.html">관리자 화면에서 로그인</a>';return}load()});
async function load(){try{const [clubSnap,jobSnap,careerSnap]=await Promise.all([getDocs(collection(db,'clubs')),getDocs(collection(db,'website_jobs')),getDocs(collection(db,'career_records'))]);clubs=clubSnap.docs.map(d=>({id:d.id,...d.data()}));jobs=jobSnap.docs.map(d=>({id:d.id,...d.data()})).filter(x=>x.status==='completed');careerRecords=careerSnap.docs.map(d=>({id:d.id,...d.data()}));const years=[...new Set(jobs.map(x=>String(x.clubYear||'')).filter(Boolean))].sort().reverse();$('year').innerHTML='<option value="">전체 연도</option>'+years.map(y=>`<option>${esc(y)}</option>`).join('');$('club').innerHTML='<option value="">전체 동아리</option><option value="__none__">동아리 없음</option>'+clubs.sort((a,b)=>String(a.name||'').localeCompare(String(b.name||''),'ko')).map(c=>`<option value="${esc(c.id)}">${esc(c.year||'')} · ${esc(c.name||c.id)}</option>`).join('');$('status').hidden=true;$('main').hidden=false;render();renderLegacy()}catch(error){console.error(error);$('status').textContent='자료를 불러오지 못했습니다. Firestore 규칙과 관리자 로그인을 확인해주세요.'}}
function merged(){const records=Object.fromEntries(careerRecords.map(x=>[x.pageId||x.id,x]));return jobs.map(job=>({...job,careerRecord:records[job.pageId||job.id]||null}))}
function filtered(){const q=$('search').value.trim().toLowerCase(),track=$('track').value,year=$('year').value,club=$('club').value,sort=$('sort').value;const rows=merged().filter(x=>{const mode=x.track||x.mode||'startup',c=x.careerRecord||{};return(!track||mode===track)&&(!year||String(x.clubYear||'')===year)&&(!club||(club==='__none__'?!x.clubCode:x.clubCode===club))&&(!q||[x.title,x.id,x.clubName,x.clubCode,c.name,c.studentId,c.department,c.desiredRole,c.careerField].join(' ').toLowerCase().includes(q))});rows.sort((a,b)=>sort==='old'?(a.createdAt?.seconds||0)-(b.createdAt?.seconds||0):sort==='title'?String(a.title||a.id).localeCompare(String(b.title||b.id),'ko'):sort==='track'?String(a.track||a.mode).localeCompare(String(b.track||b.mode)):(b.createdAt?.seconds||0)-(a.createdAt?.seconds||0));return rows}
function render(){const all=merged(),rows=filtered();$('totalCount').textContent=all.length;$('startupCount').textContent=all.filter(x=>(x.track||x.mode)==='startup').length;$('careerCount').textContent=all.filter(x=>(x.track||x.mode)==='career').length;$('finalCount').textContent=all.filter(x=>x.publishStatus==='final').length;$('body').innerHTML=rows.map(x=>{const mode=x.track||x.mode||'startup',career=x.careerRecord||{},isCareer=mode==='career';return `<tr><td>${date(x.createdAt)}</td><td><span class="pill ${isCareer?'career':''}">${isCareer?'취업':'창업'}</span></td><td><strong>${esc(x.title||x.id)}</strong><br><span class="muted">${esc(x.id)}</span></td><td>${isCareer?`${esc(career.name||'이름 미입력')}<br><span class="muted">${esc(career.studentId||'')} ${esc(career.department||'')}</span>`:`${esc(x.clubName||'동아리 미지정')}<br><span class="muted">${esc(x.clubCode||'')}</span>`}</td><td>${esc(x.clubYear||'-')}</td><td><span class="pill ${x.publishStatus==='final'?'final':''}">${x.publishStatus==='final'?'최종 확정':'초안'}</span></td><td>${isCareer?'<strong>일회성 전달</strong><br><span class="muted">완성 파일 미보관</span>':(x.clubCode?'동아리 연결':'동아리 미지정')}</td><td><div class="actions">${isCareer?'':`<a href="generated-site.html?id=${encodeURIComponent(x.pageId||x.id)}" target="_blank">사이트 보기</a>`}${!isCareer&&!x.clubCode?`<button onclick="focusLegacy('${x.id}')">동아리 지정</button>`:''}</div></td></tr>`}).join('')||'<tr><td colspan="8" class="empty">조건에 맞는 제작 기록이 없습니다.</td></tr>'}
function renderLegacy(){const legacy=jobs.filter(x=>(x.track||x.mode||'startup')!=='career'&&!x.clubCode);$('legacyCard').hidden=!legacy.length;if(!legacy.length)return;const options=clubs.map(c=>`<option value="${esc(c.id)}">${esc(c.year||'')} · ${esc(c.name||c.id)} (${esc(c.status||'')})</option>`).join('');$('legacyList').innerHTML=legacy.map(x=>`<div class="legacy" id="legacy-${x.id}"><div><strong>${esc(x.title||x.id)}</strong><div class="muted">${esc(x.id)}</div></div><select id="club-${x.id}"><option value="">동아리 선택</option>${options}</select><button onclick="assignSite('${x.id}')">지정</button></div>`).join('')}
window.focusLegacy=id=>{$('legacyCard').scrollIntoView({behavior:'smooth'});document.getElementById(`club-${id}`)?.focus()};window.assignSite=async pageId=>{const clubId=document.getElementById(`club-${pageId}`).value;if(!clubId)return alert('동아리를 선택해주세요.');const club=clubs.find(x=>x.id===clubId),job=jobs.find(x=>x.id===pageId);if(!club||!job)return;if(!confirm(`${job.title||pageId} 사이트를 ${club.name||club.id} 동아리에 지정할까요?`))return;try{const batch=writeBatch(db),jobRef=doc(db,'website_jobs',pageId),update={clubCode:club.id,clubName:club.name||'',clubYear:String(club.year||''),visibility:'club',publishStatus:'draft',legacyAssignedAt:serverTimestamp()};if(job.html){batch.set(doc(db,'website_content',pageId),{html:job.html,visibility:'club',clubCode:club.id,updatedAt:serverTimestamp()});update.html=deleteField()}batch.update(jobRef,update);await batch.commit();await load()}catch(error){console.error(error);alert('동아리를 지정하지 못했습니다. Firestore 규칙을 확인해주세요.')}};['search','track','year','club','sort'].forEach(id=>$(id).addEventListener(id==='search'?'input':'change',render));
</script></body></html>
