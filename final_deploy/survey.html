<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>설문 응답 — PCU 창업지원</title>
<style>
:root {
  --pcu-blue:#0052CC; --pcu-dark:#172B4D; --pcu-lightblue:#E6F0FF;
  --pcu-lightgray:#DFE1E6; --pcu-gray:#6B778C; --pcu-mint:#36B37E;
  --font-family-base:'Pretendard','Apple SD Gothic Neo','Malgun Gothic',sans-serif;
}
* { box-sizing:border-box; margin:0; padding:0; }
body { font-family:var(--font-family-base); background:#f0f4f8; min-height:100vh; }
.header { background:var(--pcu-dark); color:white; padding:1rem 1.5rem; }
.header h1 { font-size:0.95rem; font-weight:800; }
.wrap { max-width:600px; margin:0 auto; padding:1.5rem 1rem; }
.card { background:white; border-radius:12px; padding:1.2rem 1.5rem; margin-bottom:1rem; box-shadow:0 1px 4px rgba(0,0,0,0.08); }
input[type=text], input[type=email], textarea {
  border:1.5px solid var(--pcu-lightgray); border-radius:8px; padding:9px 12px;
  font-size:0.85rem; font-family:var(--font-family-base); outline:none; width:100%;
}
input:focus, textarea:focus { border-color:var(--pcu-blue); }
.q-title { font-size:0.9rem; font-weight:700; color:var(--pcu-dark); margin-bottom:0.7rem; }
.q-required { color:#dc2626; margin-left:2px; }
.option-label { display:flex; align-items:center; gap:8px; padding:8px 12px; border:1.5px solid var(--pcu-lightgray); border-radius:8px; cursor:pointer; margin-bottom:6px; font-size:0.85rem; transition:all 0.15s; }
.option-label:hover { border-color:var(--pcu-blue); background:var(--pcu-lightblue); }
.option-label input { width:auto; }
.star-row { display:flex; gap:8px; }
.star-btn { width:40px; height:40px; border-radius:50%; border:2px solid var(--pcu-lightgray); background:white; font-size:1rem; cursor:pointer; font-weight:700; color:var(--pcu-gray); transition:all 0.15s; }
.star-btn.active { background:var(--pcu-blue); color:white; border-color:var(--pcu-blue); }
.sign-canvas { border:1.5px solid var(--pcu-lightgray); border-radius:8px; width:100%; height:120px; cursor:crosshair; touch-action:none; }
.btn-submit { width:100%; background:var(--pcu-blue); color:white; border:none; border-radius:10px; padding:14px; font-size:0.95rem; font-weight:800; cursor:pointer; font-family:var(--font-family-base); }
</style>
</head>
<body>

<div class="header">
  <h1>📋 PCU 창업지원팀 설문</h1>
</div>

<div class="wrap" id="surveyWrap">
  <div class="card"><p style="color:var(--pcu-gray);font-size:0.85rem">⏳ 설문 로딩 중...</p></div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getFirestore, doc, getDoc, collection, writeBatch, increment, serverTimestamp }
  from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

const app = initializeApp({
  apiKey:"AIzaSyBgZ5pqslhIV7SVTgt3ZSc_ZGGtORM-P-A",
  authDomain:"pcu-startup.firebaseapp.com",
  projectId:"pcu-startup",
  storageBucket:"pcu-startup.firebasestorage.app",
  messagingSenderId:"47845163622",
  appId:"1:47845163622:web:789eaef6966e9cf28be3a7"
});
const db = getFirestore(app);

async function hashAccessCode(code) {
  const bytes = new TextEncoder().encode(String(code).trim().toUpperCase());
  const digest = await crypto.subtle.digest('SHA-256', bytes);
  return Array.from(new Uint8Array(digest)).map(b=>b.toString(16).padStart(2,'0')).join('');
}

async function resolveClubByAccessCode(code) {
  const normalized = String(code).trim().toUpperCase();
  const direct = await getDoc(doc(db,'clubs',normalized));
  if (direct.exists()) {
    const current = String(direct.data().accessCode || direct.data().code || direct.id).toUpperCase();
    if (current === normalized) return direct;
  }
  const index = await getDoc(doc(db,'club_codes',await hashAccessCode(normalized)));
  if (!index.exists() || !index.data().clubId) return null;
  const club = await getDoc(doc(db,'clubs',index.data().clubId));
  if (!club.exists()) return null;
  const current = String(club.data().accessCode || club.data().code || club.id).toUpperCase();
  return current === normalized ? club : null;
}

const params = new URLSearchParams(location.search);
const surveyId = params.get('id');
const wrap = document.getElementById('surveyWrap');
let surveyData = null;
const answers = {};
const signCanvases = {};
const escapeHTML = value => String(value ?? '')
  .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');

async function loadSurvey() {
  if (!surveyId) { wrap.innerHTML = '<div class="card"><p style="color:#dc2626">설문 ID가 없습니다.</p></div>'; return; }
  try {
    const snap = await getDoc(doc(db,'surveys',surveyId));
    if (!snap.exists()) { wrap.innerHTML = '<div class="card"><p style="color:#dc2626">설문을 찾을 수 없습니다.</p></div>'; return; }
    surveyData = snap.data();
    renderSurvey();
  } catch(e) { wrap.innerHTML = '<div class="card"><p style="color:#dc2626">로딩 실패: '+e.message+'</p></div>'; }
}

function renderSurvey() {
  const d = surveyData;
  wrap.innerHTML = `
    <div class="card">
      <h2 style="font-size:1.1rem;font-weight:900;color:var(--pcu-dark);margin-bottom:0.5rem">${escapeHTML(d.title)}</h2>
      ${d.desc?`<p style="font-size:0.82rem;color:var(--pcu-gray);line-height:1.6">${escapeHTML(d.desc)}</p>`:''}
      ${d.deadline?`<p style="font-size:0.75rem;color:#dc2626;margin-top:0.5rem">마감일: ${escapeHTML(d.deadline)}</p>`:''}
    </div>
    ${d.target==='club'?`
    <div class="card">
      <div class="q-title">동아리 코드 <span class="q-required">*</span></div>
      <input type="text" id="clubCodeInput" placeholder="동아리 코드 입력" oninput="this.value=this.value.toUpperCase()">
    </div>`:''}
    ${(d.questions||[]).map((q,i) => renderQuestion(q,i)).join('')}
    <button class="btn-submit" onclick="submitSurvey()">✅ 제출하기</button>
    <p style="font-size:0.72rem;color:var(--pcu-gray);text-align:center;margin-top:0.8rem">배재대학교 창업지원팀</p>
  `;
  // 서명 캔버스 초기화
  (d.questions||[]).forEach(q => {
    if (q.type==='서명') initCanvas(q.id);
  });
}

function renderQuestion(q,i) {
  const reqMark = q.required ? '<span class="q-required">*</span>' : '';
  return `<div class="card">
    <div class="q-title">Q${i+1}. ${escapeHTML(q.text||'(질문 없음)')} ${reqMark}</div>
    ${q.type==='객관식' ? q.options.map((opt,oi)=>`
      <label class="option-label">
        <input type="radio" name="q-${q.id}" value="${escapeHTML(opt)}" onchange="setAnswer(${q.id},decodeURIComponent('${encodeURIComponent(opt)}'))"> ${escapeHTML(opt)}
      </label>`).join('') : ''}
    ${q.type==='주관식' ? `<textarea id="ans-${q.id}" rows="3" placeholder="답변을 입력하세요" oninput="setAnswer(${q.id},this.value)"></textarea>` : ''}
    ${q.type==='점수' ? `<div class="star-row">${[1,2,3,4,5].map(n=>`
      <button class="star-btn" id="star-${q.id}-${n}" onclick="setScore(${q.id},${n})">${n}</button>`).join('')}</div>` : ''}
    ${q.type==='서명' ? `
      <canvas class="sign-canvas" id="canvas-${q.id}"></canvas>
      <button onclick="clearSign(${q.id})" style="margin-top:4px;background:none;border:1.5px solid var(--pcu-lightgray);border-radius:6px;padding:4px 12px;font-size:0.75rem;cursor:pointer">지우기</button>` : ''}
  </div>`;
}

window.setAnswer = (id,v) => answers[id] = v;
window.setScore = (id,n) => {
  answers[id] = n;
  [1,2,3,4,5].forEach(i => document.getElementById(`star-${id}-${i}`)?.classList.toggle('active', i<=n));
};

function initCanvas(qId) {
  const canvas = document.getElementById(`canvas-${qId}`);
  if (!canvas) return;
  const ctx = canvas.getContext('2d');
  canvas.width = canvas.offsetWidth;
  canvas.height = 120;
  let drawing = false;
  const getPos = e => {
    const r = canvas.getBoundingClientRect();
    const t = e.touches?.[0] || e;
    return { x: t.clientX-r.left, y: t.clientY-r.top };
  };
  canvas.addEventListener('mousedown', e => { drawing=true; ctx.beginPath(); const p=getPos(e); ctx.moveTo(p.x,p.y); });
  canvas.addEventListener('mousemove', e => { if(!drawing) return; const p=getPos(e); ctx.lineTo(p.x,p.y); ctx.stroke(); });
  canvas.addEventListener('mouseup', () => { drawing=false; answers[qId]=canvas.toDataURL(); });
  canvas.addEventListener('touchstart', e => { e.preventDefault(); drawing=true; ctx.beginPath(); const p=getPos(e); ctx.moveTo(p.x,p.y); });
  canvas.addEventListener('touchmove', e => { e.preventDefault(); if(!drawing) return; const p=getPos(e); ctx.lineTo(p.x,p.y); ctx.stroke(); });
  canvas.addEventListener('touchend', () => { drawing=false; answers[qId]=canvas.toDataURL(); });
  ctx.strokeStyle='#172B4D'; ctx.lineWidth=2; ctx.lineCap='round';
  signCanvases[qId] = canvas;
}
window.clearSign = (id) => {
  const c = signCanvases[id];
  if (c) { c.getContext('2d').clearRect(0,0,c.width,c.height); delete answers[id]; }
};

window.submitSurvey = async function() {
  // 중복 응답 방지 (localStorage)
  const submitKey = `pcu_survey_submitted_${surveyId}`;
  if (localStorage.getItem(submitKey)) {
    alert('이미 응답하셨습니다. 설문은 1회만 제출 가능합니다.');
    return;
  }

  // 필수 항목 검사
  for (const q of surveyData.questions||[]) {
    if (q.required && !answers[q.id]) {
      alert(`Q${(surveyData.questions.indexOf(q)+1)}. "${q.text||'질문'}" 항목은 필수입니다.`);
      return;
    }
  }
  let clubCode = document.getElementById('clubCodeInput')?.value.trim().toUpperCase()||'';
  if (surveyData.target==='club' && !clubCode) { alert('동아리 코드를 입력해주세요.'); return; }
  if (surveyData.target==='club') {
    const clubSnap = await resolveClubByAccessCode(clubCode);
    if (!clubSnap) { alert('등록되지 않은 동아리 코드입니다.'); return; }
    if (clubSnap.data().status !== 'active') {
      alert('운영이 종료된 동아리는 설문에 응답할 수 없습니다.');
      return;
    }
    clubCode = clubSnap.id;
  }

  const btn = document.querySelector('.btn-submit');
  if (btn) { btn.disabled = true; btn.textContent = '제출 중...'; }

  try {
    const batch = writeBatch(db);
    const responseRef = doc(collection(db,'surveys',surveyId,'responses'));
    batch.set(responseRef, {
      answers, clubCode, createdAt: serverTimestamp(), ua: navigator.userAgent.substring(0,100)
    });
    batch.update(doc(db,'surveys',surveyId), { responseCount: increment(1) });
    await batch.commit();
    // 제출 완료 기록 (중복 방지)
    localStorage.setItem(submitKey, new Date().toISOString());
    wrap.innerHTML = `<div class="card" style="text-align:center;padding:2rem">
      <div style="font-size:2rem;margin-bottom:0.8rem">✅</div>
      <div style="font-size:1rem;font-weight:800;color:var(--pcu-dark);margin-bottom:0.5rem">제출 완료!</div>
      <div style="font-size:0.82rem;color:var(--pcu-gray)">응답해 주셔서 감사합니다.</div>
      <div style="font-size:0.78rem;color:var(--pcu-gray);margin-top:0.5rem">배재대학교 창업지원팀</div>
    </div>`;
  } catch(e) {
    let msg = '제출 실패: ' + e.message;
    if (e.code === 'permission-denied') msg = '권한 오류가 발생했습니다. 잠시 후 다시 시도해주세요.';
    else if (e.message?.includes('network') || e.code === 'unavailable') msg = '네트워크 연결을 확인하고 다시 시도해주세요.';
    alert(msg);
    if (btn) { btn.disabled = false; btn.textContent = '✅ 제출하기'; }
  }
};

loadSurvey();
</script>
</body>
</html>
