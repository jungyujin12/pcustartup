<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>창업동아리 보고서 출력</title>
  <!-- pdf-lib: 원본 PDF 위에 텍스트 오버레이 -->
  <script src="https://unpkg.com/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
  <!-- fontkit: 한글 폰트 embed 지원 -->
  <script src="https://unpkg.com/@pdf-lib/fontkit@1.1.1/dist/fontkit.umd.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: '맑은 고딕','Malgun Gothic',sans-serif; background: #e0e0e0; min-height: 100vh; }

    .ctrl {
      background: #1F2933; color: white;
      padding: 12px 24px;
      display: flex; align-items: center; justify-content: space-between;
      position: sticky; top: 0; z-index: 100;
      box-shadow: 0 2px 8px rgba(0,0,0,0.4);
    }
    .ctrl-left h2 { font-size: 1rem; font-weight: 700; }
    .ctrl-left p { font-size: 0.72rem; color: rgba(255,255,255,0.55); margin-top: 2px; }
    .ctrl-btns { display: flex; gap: 0.7rem; }
    .btn-dl {
      background: #0052CC; color: white; border: none; border-radius: 6px;
      padding: 9px 22px; font-size: 0.88rem; font-weight: 700;
      cursor: pointer; font-family: inherit;
    }
    .btn-dl:hover { background: #0042A0; }
    .btn-dl.green { background: #31B37C; }
    .btn-dl.green:hover { background: #27936a; }
    .btn-dl:disabled { opacity: 0.5; cursor: not-allowed; }

    /* 서명 섹션 */
    .sign-section {
      background: white; border-radius: 12px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.15);
      padding: 1.5rem;
      max-width: 820px; margin: 20px auto 12px;
    }
    .sign-section h3 { font-size: 1rem; font-weight: 800; color: #1F2933; margin-bottom: 1rem; padding-bottom: 0.5rem; border-bottom: 2px solid #DEEAF1; }
    .sign-items { display: flex; flex-direction: column; gap: 1rem; }
    .sign-item { background: #F8FAFC; border: 1px solid #e0e0e0; border-radius: 10px; padding: 1rem 1.2rem; }
    .sign-item-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 0.8rem; }
    .sign-item-label { font-size: 0.88rem; font-weight: 700; color: #1F2933; }
    .sign-mode-btns { display: flex; gap: 0.4rem; }
    .mode-btn { font-size: 0.75rem; padding: 4px 10px; border-radius: 6px; border: 1.5px solid #ccc; background: white; cursor: pointer; font-family: inherit; font-weight: 600; color: #666; }
    .mode-btn.active { border-color: #0052CC; color: #0052CC; background: #E9F4FF; }
    .sign-canvas-area canvas { border: 1.5px solid #ccc; border-radius: 6px; cursor: crosshair; width: 100%; height: 80px; touch-action: none; display: block; }
    .sign-upload-area { display: none; }
    .sign-upload-box { border: 2px dashed #0052CC; border-radius: 8px; padding: 1rem; text-align: center; cursor: pointer; background: #E9F4FF; font-size: 0.83rem; color: #0052CC; }
    .sign-preview-img { max-height: 80px; border: 1px solid #ccc; border-radius: 6px; margin-top: 0.5rem; display: none; }
    .sign-actions { display: flex; gap: 0.5rem; margin-top: 0.6rem; align-items: center; }
    .btn-xs { font-size: 0.75rem; padding: 4px 10px; border-radius: 5px; border: 1px solid #ccc; background: white; cursor: pointer; font-family: inherit; }
    .btn-xs.red { border-color: #dc2626; color: #dc2626; }

    /* 미리보기 */
    .preview-wrap { max-width: 820px; margin: 0 auto 40px; padding: 0 10px; }
    .preview-info {
      background: white; border-radius: 12px; padding: 1.5rem;
      box-shadow: 0 2px 12px rgba(0,0,0,0.15); margin-bottom: 12px;
    }
    .preview-info h3 { font-size: 1rem; font-weight: 800; color: #1F2933; margin-bottom: 1rem; padding-bottom: 0.5rem; border-bottom: 2px solid #DEEAF1; }
    .info-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0.6rem; }
    .info-item { font-size: 0.85rem; }
    .info-label { font-weight: 700; color: #0052CC; }
    .info-val { color: #333; }
    .notice {
      background: #FFF8E1; border: 1.5px solid #FFD600; border-radius: 10px;
      padding: 1rem 1.2rem; font-size: 0.83rem; color: #7A6A00; margin-top: 1rem; line-height: 1.7;
    }

    /* 로딩 */
    .loading-overlay { position: fixed; inset: 0; background: rgba(255,255,255,0.92); z-index: 999; display: none; align-items: center; justify-content: center; flex-direction: column; gap: 1rem; }
    .loading-overlay.show { display: flex; }
    .spinner { width: 44px; height: 44px; border: 3px solid #DEEAF1; border-top-color: #0052CC; border-radius: 50%; animation: spin 0.8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .loading-text { color: #0052CC; font-weight: 700; font-size: 0.9rem; }
  </style>
</head>
<body>

<div class="loading-overlay" id="loadingOverlay">
  <div class="spinner"></div>
  <p class="loading-text" id="loadingText">PDF 생성 중...</p>
</div>

<div class="ctrl">
  <div class="ctrl-left">
    <h2>📄 창업동아리 보고서</h2>
    <p>서명 작성 후 PDF 다운로드하세요</p>
  </div>
  <div class="ctrl-btns">
    <button class="btn-dl green" onclick="window.saveSignatures()">💾 서명 저장</button>
    <button class="btn-dl" id="pdfBtn" onclick="window.generatePDF()">⬇️ PDF 다운로드</button>
  </div>
</div>

<!-- 서명 섹션 -->
<div class="sign-section">
  <h3>✍️ 서명 입력</h3>
  <div class="sign-items" id="signItems"></div>
</div>

<!-- 미리보기 / 데이터 확인 -->
<div class="preview-wrap">
  <div class="preview-info" id="previewInfo">
    <h3>📋 입력 데이터 확인</h3>
    <div class="info-grid" id="infoGrid">
      <div style="color:#999;font-size:0.85rem">⏳ 데이터 로딩 중...</div>
    </div>
    <div class="notice">
      ℹ️ PDF 버튼을 클릭하면 <strong>원본 양식 위에 입력 데이터가 자동으로 채워진 PDF</strong>가 생성됩니다.<br>
      한글이 정확하게 출력됩니다. 서명은 미리 저장 후 PDF를 생성해주세요.
    </div>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getStorage, ref, uploadString, getDownloadURL } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-storage.js";

const firebaseConfig = {
  apiKey: "AIzaSyBgZ5pqslhIV7SVTgt3ZSc_ZGGtORM-P-A",
  authDomain: "pcu-startup.firebaseapp.com",
  projectId: "pcu-startup",
  storageBucket: "pcu-startup.firebasestorage.app",
  messagingSenderId: "47845163622",
  appId: "1:47845163622:web:789eaef6966e9cf28be3a7"
};
const app = initializeApp(firebaseConfig);
const storage = getStorage(app);

// ── 데이터 로드 ──
var formData = null;
var clubCode = '';
const sigData = {};

// 서명 정의
const SIGN_DEFS = [
  { id: 'sig-rep',  label: '동아리 대표 서명' },
  { id: 'sig-prof', label: '지도교수 서명' },
  { id: 'sig-prv',  label: '개인정보 동의 서명' },
];

// ── 서명 UI 초기화 ──
function initSignatures() {
  const container = document.getElementById('signItems');
  container.innerHTML = SIGN_DEFS.map(s => `
    <div class="sign-item" id="item-${s.id}">
      <div class="sign-item-header">
        <span class="sign-item-label">${s.label}</span>
        <div class="sign-mode-btns">
          <button class="mode-btn active" onclick="setMode('${s.id}','draw')">✏️ 직접 그리기</button>
          <button class="mode-btn" onclick="setMode('${s.id}','upload')">📷 이미지 업로드</button>
        </div>
      </div>
      <div class="sign-canvas-area" id="canvas-area-${s.id}">
        <canvas id="${s.id}" width="600" height="120"
          onmousedown="startDraw(event,'${s.id}')"
          ontouchstart="startDraw(event,'${s.id}')"></canvas>
        <div class="sign-actions">
          <button class="btn-xs red" onclick="clearSig('${s.id}')">🗑️ 지우기</button>
        </div>
      </div>
      <div class="sign-upload-area" id="upload-area-${s.id}">
        <div class="sign-upload-box" onclick="document.getElementById('file-${s.id}').click()">
          📷 서명 이미지 클릭하여 업로드 (PNG, JPG)
        </div>
        <input type="file" id="file-${s.id}" accept="image/*" style="display:none"
          onchange="handleSigUpload(event,'${s.id}')">
        <img class="sign-preview-img" id="preview-${s.id}">
        <div class="sign-actions">
          <button class="btn-xs red" onclick="clearSig('${s.id}')">🗑️ 지우기</button>
        </div>
      </div>
    </div>
  `).join('');
  SIGN_DEFS.forEach(s => initCanvas(s.id));
}

window.setMode = function(id, mode) {
  document.getElementById('canvas-area-'+id).style.display = mode==='draw' ? 'block' : 'none';
  document.getElementById('upload-area-'+id).style.display = mode==='upload' ? 'block' : 'none';
  document.querySelectorAll('#item-'+id+' .mode-btn').forEach((b,i) => b.classList.toggle('active', (mode==='draw'&&i===0)||(mode==='upload'&&i===1)));
};

let drawing=false, lastX=0, lastY=0, currentCanvas=null;
function initCanvas(id) {
  const c = document.getElementById(id); if (!c) return;
  const ctx = c.getContext('2d');
  ctx.strokeStyle='#000'; ctx.lineWidth=2; ctx.lineCap='round'; ctx.lineJoin='round';
}
function getPos(e, canvas) {
  const r = canvas.getBoundingClientRect();
  const sx = canvas.width/r.width, sy = canvas.height/r.height;
  if (e.touches) return { x:(e.touches[0].clientX-r.left)*sx, y:(e.touches[0].clientY-r.top)*sy };
  return { x:(e.clientX-r.left)*sx, y:(e.clientY-r.top)*sy };
}
window.startDraw = function(e, id) {
  e.preventDefault();
  const canvas = document.getElementById(id);
  currentCanvas = { id, canvas, ctx: canvas.getContext('2d') };
  drawing = true;
  const pos = getPos(e, canvas);
  lastX=pos.x; lastY=pos.y;
  currentCanvas.ctx.beginPath(); currentCanvas.ctx.moveTo(lastX, lastY);
  document.addEventListener('mousemove', onDraw);
  document.addEventListener('mouseup', stopDraw);
  document.addEventListener('touchmove', onDraw, {passive:false});
  document.addEventListener('touchend', stopDraw);
};
function onDraw(e) {
  if (!drawing||!currentCanvas) return;
  e.preventDefault();
  const pos = getPos(e, currentCanvas.canvas);
  currentCanvas.ctx.lineTo(pos.x, pos.y); currentCanvas.ctx.stroke();
  lastX=pos.x; lastY=pos.y;
  sigData[currentCanvas.id] = currentCanvas.canvas.toDataURL('image/png');
}
function stopDraw() {
  drawing=false;
  if (currentCanvas) { sigData[currentCanvas.id]=currentCanvas.canvas.toDataURL('image/png'); currentCanvas.ctx.beginPath(); currentCanvas=null; }
  document.removeEventListener('mousemove', onDraw);
  document.removeEventListener('mouseup', stopDraw);
  document.removeEventListener('touchmove', onDraw);
  document.removeEventListener('touchend', stopDraw);
}
window.clearSig = function(id) {
  const c=document.getElementById(id); if(c) c.getContext('2d').clearRect(0,0,c.width,c.height);
  const img=document.getElementById('preview-'+id); if(img){img.src='';img.style.display='none';}
  delete sigData[id];
};
window.handleSigUpload = function(e, id) {
  const file=e.target.files[0]; if(!file) return;
  const reader=new FileReader();
  reader.onload = ev => {
    sigData[id]=ev.target.result;
    const img=document.getElementById('preview-'+id);
    if(img){img.src=ev.target.result;img.style.display='block';}
  };
  reader.readAsDataURL(file);
};

// ── Firebase 서명 저장/불러오기 ──
window.saveSignatures = async function() {
  if (!clubCode) { alert('동아리 코드가 없습니다.'); return; }
  const btn = document.querySelector('.btn-dl.green');
  btn.textContent='저장 중...'; btn.disabled=true;
  let saved=0;
  for (const s of SIGN_DEFS) {
    if (sigData[s.id]) {
      try {
        await uploadString(ref(storage, `signs/${clubCode}/${s.id}.png`), sigData[s.id], 'data_url');
        saved++;
      } catch(e) { console.error(e); }
    }
  }
  btn.textContent=saved?`✅ ${saved}개 저장됨`:'💾 서명 저장';
  btn.disabled=false;
  setTimeout(()=>{btn.textContent='💾 서명 저장';},2000);
};

async function loadSavedSignatures() {
  if (!clubCode) return;
  for (const s of SIGN_DEFS) {
    try {
      const url = await getDownloadURL(ref(storage, `signs/${clubCode}/${s.id}.png`));
      const img=new Image(); img.crossOrigin='anonymous';
      img.onload=()=>{
        const c=document.getElementById(s.id); if(!c) return;
        const ctx=c.getContext('2d');
        ctx.clearRect(0,0,c.width,c.height);
        ctx.drawImage(img,0,0,c.width,c.height);
        sigData[s.id]=c.toDataURL('image/png');
      };
      img.src=url;
    } catch(e) {}
  }
}

// ── 미리보기 렌더링 ──
function renderPreview() {
  const d = formData;
  const grid = document.getElementById('infoGrid');
  const items = [
    ['동아리명', d.clubName], ['아이템명', d.itemName],
    ['대표자', d.repName], ['연락처', d.repTel],
    ['지도교수', d.profName], ['창립일자', d.foundDate],
    ['회원현황', `총 ${d.memberCount||''}명 / 남 ${d.memberMale||''}명 / 여 ${d.memberFemale||''}명`],
    ['사업자등록', d.bizReg||'미입력'],
  ];
  grid.innerHTML = items.map(([label, val]) =>
    `<div class="info-item"><span class="info-label">${label}: </span><span class="info-val">${val||'(미입력)'}</span></div>`
  ).join('');
}

// ── PDF 생성 (pdf-lib + 원본 양식) ──
window.generatePDF = async function() {
  const overlay = document.getElementById('loadingOverlay');
  const loadingText = document.getElementById('loadingText');
  const btn = document.getElementById('pdfBtn');
  overlay.classList.add('show');
  btn.disabled = true;

  try {
    const { PDFDocument, rgb, StandardFonts } = PDFLib;

    loadingText.textContent = '원본 양식 로딩 중...';

    // 원본 PDF 로드 (같은 서버의 파일 또는 Firebase Storage)
    // 원본 PDF를 final_deploy/template.pdf 에 올려두어야 함
    const templateUrl = './template.pdf';
    let templateBytes;
    try {
      const res = await fetch(templateUrl);
      if (!res.ok) throw new Error('template.pdf not found');
      templateBytes = await res.arrayBuffer();
    } catch(e) {
      throw new Error('원본 양식 파일(template.pdf)을 찾을 수 없습니다.\nfinal_deploy 폴더에 template.pdf를 업로드해주세요.');
    }

    loadingText.textContent = '한글 폰트 로딩 중...';

    // 한글 폰트 로드 (NotoSansKR)
    const fontUrl = './font.ttf';
    let fontBytes;
    try {
      const fontRes = await fetch(fontUrl);
      fontBytes = await fontRes.arrayBuffer();
    } catch(e) {
      throw new Error('한글 폰트 로드 실패. 인터넷 연결을 확인해주세요.');
    }

    loadingText.textContent = 'PDF 생성 중...';

    const pdfDoc = await PDFDocument.load(templateBytes);
    pdfDoc.registerFontkit(fontkit);
    const font = await pdfDoc.embedFont(fontBytes);

    const pages = pdfDoc.getPages();
    const d = formData;

    // pdf-lib 좌표: 좌하단 원점, y = pageHeight - pdfplumber_top
    // A4: 595 x 841
    const H = 841;
    function y(top) { return H - top; }
    function drawText(page, text, x, top, size=9, color=rgb(0,0,0)) {
      if (!text) return;
      page.drawText(String(text), { x, y: y(top), size, font, color });
    }
    function drawCheck(page, condition, x, top) {
      // ☑ 또는 ☐
      page.drawText(condition ? '☑' : '☐', { x, y: y(top), size: 10, font, color: rgb(0,0,0) });
    }

    // ══════════════════════════
    // P1: 신청서
    // ══════════════════════════
    const p1 = pages[0];
    const today = new Date();
    // 사업자등록여부: Yes □(x=446) No □(x=503) — 체크만 표시, □는 원본에 있음
    if (d.bizReg==='등록') drawText(p1, '✓', 448, 213, 8);
    else drawText(p1, '✓', 505, 213, 8);
    // 동아리명: 셀 x0=169 top=221 bot=241 → 입력 x=172, top=234
    drawText(p1, d.clubName, 172, 234);
    // 사업자등록번호: x0=425 top=221 bot=241
    drawText(p1, d.bizNo, 428, 234);
    // 아이템명: x0=169 top=241 bot=260
    drawText(p1, d.itemName, 172, 253);
    // 희망분야: □ x=181, 각 행 top
    if (d.itemField==='지식'||d.itemField==='지식창업') drawText(p1, '✓', 183, 278, 8);
    else if (d.itemField==='기술'||d.itemField==='기술창업') drawText(p1, '✓', 183, 312, 8);
    else if (d.itemField==='일반'||d.itemField==='일반창업') drawText(p1, '✓', 183, 340, 8);
    else if (d.itemField==='해당없음') drawText(p1, '✓', 183, 363, 8);
    // 대표자: 성명 x0=169 top=373 bot=392
    drawText(p1, d.repName, 172, 385);
    // 학번(학년): x0=425 top=373 bot=392
    drawText(p1, d.repId, 428, 385);
    // 소속 학과(부): "대학 학과(부) 전공" 행 x0=169 top=392 bot=412
    drawText(p1, d.repDept, 282, 405, 8.5);
    // 연락처 휴대폰: x0=169 top=412, "휴대폰:" 라벨(x=170) 다음
    drawText(p1, d.repTel, 215, 424, 8.5);
    // 이메일: x0=352 top=412
    drawText(p1, d.repEmail, 392, 424, 8);
    // 지도교수 성명: x0=169 top=431 bot=448
    drawText(p1, d.profName||'', 172, 442);
    // 지도교수 학과: x0=379 top=431 bot=448
    drawText(p1, d.profDept||'', 382, 442);
    // 지도교수 연락처: x0=169 top=448 bot=464
    drawText(p1, d.profTel||'', 172, 458, 8.5);
    // 지도교수 E-mail: x0=379 top=448 bot=464
    drawText(p1, d.profEmail||'', 382, 458, 8);
    // 창립일자: x0=169 top=464 bot=478
    drawText(p1, d.foundDate, 172, 473);
    // 활동공간: x0=169 top=478 bot=492
    drawText(p1, d.actSpace, 172, 487);
    // 회원현황: 총( )명 / 남( )명 / 여( )명 — 괄호 안 숫자
    drawText(p1, d.memberCount, 298, 501);
    drawText(p1, d.memberMale,  349, 501);
    drawText(p1, d.memberFemale, 405, 501);
    // 지원경로 체크
    if (d.applyRoute==='홈페이지') drawText(p1, '✓', 187, 516, 8);
    else if (d.applyRoute==='주위권유') drawText(p1, '✓', 280, 516, 8);
    else if (d.applyRoute==='기타') drawText(p1, '✓', 372, 516, 8);
    // 날짜: "년 월 일" 텍스트 앞에 숫자만 삽입
    drawText(p1, String(today.getFullYear()), 236, 657);
    drawText(p1, String(today.getMonth()+1), 279, 657);
    drawText(p1, String(today.getDate()), 316, 657);
    // 서명 (대표): "동아리 대표:" 라인 y≈677
    if (sigData['sig-rep']) {
      try {
        const sigImg = await pdfDoc.embedPng(sigData['sig-rep']);
        p1.drawImage(sigImg, { x: 295, y: y(695), width: 90, height: 16 });
      } catch(e) { try { const si=await pdfDoc.embedJpg(sigData['sig-rep']); p1.drawImage(si,{x:295,y:y(695),width:90,height:16}); } catch(e2){} }
    }
    // 서명 (지도교수): "지 도 교 수:" 라인 y≈706
    if (sigData['sig-prof']) {
      try {
        const sigImg = await pdfDoc.embedPng(sigData['sig-prof']);
        p1.drawImage(sigImg, { x: 295, y: y(724), width: 90, height: 16 });
      } catch(e) { try { const si=await pdfDoc.embedJpg(sigData['sig-prof']); p1.drawImage(si,{x:295,y:y(724),width:90,height:16}); } catch(e2){} }
    }

    // ══════════════════════════
    // P2: 운영비 사용 계획서
    // ══════════════════════════
    const p2 = pages[1];
    const BKEYS = ['재료비','시험분석비','수용비','전문가활용비','기술정보활동비','여비'];
    // 셀 top: 재료비=223,bot=307 → mid=265 / 시험=307,bot=387 → mid=347 / 수용비=387,bot=466 → mid=427
    // 전문가=466,bot=546 → mid=506 / 기술=546,bot=626 → mid=586 / 여비=626,bot=704 → mid=665
    const budgetTops = [265, 347, 427, 506, 586, 665];
    let total = 0;
    BKEYS.forEach((k, i) => {
      const plan = parseInt((d.budget?.[k+'_plan']||'0').replace(/[^0-9]/g,''))||0;
      const note = d.budget?.[k+'_note']||'';
      total += plan;
      // 예산 칸: x0=227 x1=294 → 우정렬로 x=285
      if (plan) drawText(p2, plan.toLocaleString(), 232, budgetTops[i]);
      // 산출내역 칸: x0=294
      if (note) drawText(p2, note, 297, budgetTops[i], 8);
    });
    // 합계: top=704 bot=781 → mid=742
    if (total) drawText(p2, total.toLocaleString(), 232, 742);

    // ══════════════════════════
    // P4: 창업 계획서
    // ══════════════════════════
    const p4 = pages[3];
    // 아이템 카드 박스: 각 □ 라벨 top 기준 +13 아래에 텍스트
    // 한줄소개: □ top=242 → 텍스트 top=248
    drawText(p4, d.itemOneliner||'', 170, 248, 8);
    // 아이템명: □ top=280
    drawText(p4, d.itemName||'', 140, 286, 8);
    // 기능: □ top=318
    drawText(p4, d.itemFunction||'', 215, 324, 8);
    // 목적성: □ top=357
    drawText(p4, d.itemPurpose||'', 165, 363, 8);
    // 차별점: □ top=395
    drawText(p4, d.itemDiff||'', 190, 401, 8);
    // 수요대상: □ top=434
    drawText(p4, d.itemTarget||'', 165, 440, 8);
    // 구성원 역할분담 - 창업자 역량: □ top=547
    drawText(p4, d.teamSynergy||'', 100, 570, 8);
    // 팀 구성원: □ top=605
    if (d.members) {
      d.members.filter(m=>m.name).slice(0,3).forEach((m, i) => {
        drawText(p4, m.name+(m.dept?' ('+m.dept+' '+m.grade+'학년)':'')+(m.role?' - '+m.role:''), 100, 622+i*14, 7.5);
      });
    }

    // ══════════════════════════
    // P5-6: 사업계획 (원본 P5, P6 동일 양식)
    // ══════════════════════════
    [pages[4], pages[5]].forEach(pg => {
      drawText(pg, d.bizMarket||'', 100, 230, 8);
      drawText(pg, d.bizGoal||'', 100, 380, 8);
    });

    // ══════════════════════════
    // P7: 운영결과보고서
    // ══════════════════════════
    const p7 = pages[6];
    // 타이틀: "[동아리명] 창업동아리 운영결과보고서" — top=125
    drawText(p7, d.clubName||'', 136, 131, 10);
    // 설립목적: x0=152 top=177 bot=307 → 입력 x=155, top=195
    drawText(p7, d.resultPurpose||'', 155, 195, 8.5);
    // 활동내용: top=307 bot=438 → 입력 top=325
    drawText(p7, d.resultActivity||'', 155, 325, 8.5);
    // 참여후기: top=438 bot=632 → 입력 top=455
    drawText(p7, d.resultReview||'', 155, 455, 8.5);
    // 차후계획: top=632 bot=778 → 입력 top=650
    drawText(p7, d.resultNext||'', 155, 650, 8.5);

    // ══════════════════════════
    // P8: 타임테이블
    // ══════════════════════════
    const p8 = pages[7];
    const months = ['4월','5월','6월','7월','8월','9월','10월','11월','12월'];
    // 3x3 그리드: col x=[105,265,425], row y=[210,368,526] (top 기준)
    const tlX = [105, 265, 425];
    const tlY = [210, 368, 526];
    months.forEach((m, idx) => {
      const col = idx % 3, row = Math.floor(idx/3);
      const tl = (d.timeline||[]).find(t=>(t.month||t[0])===m);
      const content = tl ? (tl.content||tl[1]||'') : '';
      if (content) {
        drawText(p8, content.slice(0,40), tlX[col], tlY[row]+20, 8);
        if (content.length>40) drawText(p8, content.slice(40,80), tlX[col], tlY[row]+34, 8);
      }
    });

    // ══════════════════════════
    // P11: 개인정보 동의서 서명
    // ══════════════════════════
    const p11 = pages[10];
    drawText(p11, today.getFullYear()+'년 '+(today.getMonth()+1)+'월 '+today.getDate()+'일', 220, 755);
    drawText(p11, d.repName||'', 130, 775);
    if (sigData['sig-prv']) {
      const sigImg = await pdfDoc.embedPng(sigData['sig-prv']).catch(async ()=> await pdfDoc.embedJpg(sigData['sig-prv']));
      p11.drawImage(sigImg, { x: 300, y: y(780), width: 80, height: 18 });
    }

    // ══════════════════════════
    // P12: 회원 명단
    // ══════════════════════════
    const p12 = pages[11];
    // 타이틀 "[동아리명]": top=144
    drawText(p12, d.clubName||'', 160, 149, 10);
    if (d.members) {
      // 행 1~10: top 214,242,270,298,326,354,382,410,438,466 (각 28px 간격)
      const mY = Array.from({length:10},(_,i)=>214+i*28);
      d.members.slice(0,10).forEach((m, i) => {
        if (!m.name) return;
        drawText(p12, m.name,   115, mY[i], 8.5);
        drawText(p12, m.dept||'', 178, mY[i], 8);
        drawText(p12, m.grade||'', 241, mY[i], 8.5);
        drawText(p12, m.stuId||'', 274, mY[i], 8);
        drawText(p12, m.tel||'',   344, mY[i], 8);
        drawText(p12, m.email||'', 438, mY[i], 7.5);
      });
      // 총원: top=494
      drawText(p12, d.memberCount||'', 116, 498, 9);
    }

    // ── PDF 저장 ──
    loadingText.textContent = 'PDF 저장 중...';
    const pdfBytes = await pdfDoc.save();
    const blob = new Blob([pdfBytes], { type: 'application/pdf' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `PCU_창업동아리_${d.clubName||'보고서'}_${today.toISOString().slice(0,10)}.pdf`;
    a.click();
    URL.revokeObjectURL(url);

  } catch(err) {
    console.error(err);
    alert('PDF 생성 실패:\n' + err.message);
  } finally {
    document.getElementById('loadingOverlay').classList.remove('show');
    document.getElementById('pdfBtn').disabled = false;
  }
};

// ── 초기 실행 ──
const raw = sessionStorage.getItem('pcu_print_data');
clubCode = sessionStorage.getItem('pcu_club_code') || '';

if (!raw) {
  document.getElementById('infoGrid').innerHTML =
    '<div style="color:red;font-size:0.85rem">❌ 데이터 없음. report.html에서 다시 시도해주세요.</div>';
  document.getElementById('pdfBtn').disabled = true;
} else {
  formData = JSON.parse(raw);
  initSignatures();
  loadSavedSignatures();
  renderPreview();
}
</script>
</body>
</html>
