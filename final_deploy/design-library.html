<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>디자인 라이브러리 | PCU</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f4f7fb;color:#172b42;font-family:"Noto Sans KR","Malgun Gothic",sans-serif;word-break:keep-all}.top{background:#10243e;color:#fff;padding:1rem}.top>div{max-width:1280px;margin:auto;display:flex;align-items:center;gap:.8rem}.top h1{margin:0 auto 0 0;font-size:1.08rem}.top a{color:#fff;text-decoration:none;border:1px solid #66809b;border-radius:8px;padding:.5rem .75rem}.wrap{max-width:1280px;margin:1.4rem auto;padding:0 1rem}.card{background:#fff;border:1px solid #dbe5ef;border-radius:14px;padding:1.1rem;box-shadow:0 7px 22px rgba(20,48,78,.06);margin-bottom:1rem}.notice{border-left:4px solid #009ac9;background:#edf8fc;border-radius:7px;padding:.85rem 1rem;font-size:.82rem;line-height:1.65}.form{display:grid;grid-template-columns:150px 120px 1fr auto;gap:.65rem;margin-top:1rem}.form textarea{min-height:44px;resize:vertical}.form input,.form select,.form textarea,.form button,.toolbar input,.toolbar select{font:inherit;border:1px solid #bdcad8;border-radius:8px;padding:.67rem;min-width:0}.form button{background:#007aa0;color:#fff;border:0;font-weight:800;cursor:pointer}.toolbar{display:grid;grid-template-columns:1fr repeat(2,160px);gap:.6rem;margin:1rem 0}.stats{display:flex;gap:.5rem;flex-wrap:wrap}.stat{padding:.48rem .7rem;border-radius:999px;background:#eaf2fb;font-size:.73rem;font-weight:800}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:1rem}.design{border:1px solid #dbe5ef;border-radius:13px;overflow:hidden;background:#fff;display:flex;flex-direction:column}.preview{min-height:210px;padding:1.1rem;background:var(--paper,#fff);color:var(--ink,#172b42);position:relative;overflow:hidden}.preview:before{content:"";position:absolute;inset:0 auto 0 0;width:7px;background:var(--accent,#009ac9)}.preview small{font-size:.63rem;text-transform:uppercase;letter-spacing:.12em;opacity:.62}.preview h2{font-size:clamp(1.3rem,2.5vw,2rem);line-height:1.05;max-width:85%;margin:1.5rem 0 .7rem}.preview p{font-size:.76rem;line-height:1.55;max-width:85%;opacity:.75}.bars{display:grid;grid-template-columns:1.4fr .8fr;gap:.45rem;margin-top:1.2rem}.bars i{display:block;height:34px;background:var(--surface,#eef3f8);border:1px solid color-mix(in srgb,var(--accent,#009ac9) 35%,transparent);border-radius:6px}.meta{padding:1rem;display:flex;flex-direction:column;gap:.55rem;flex:1}.meta h3{margin:0;font-size:.95rem}.muted{color:#687b8d;font-size:.72rem;line-height:1.55}.tags{display:flex;gap:.3rem;flex-wrap:wrap}.tag,.status{font-size:.65rem;border-radius:999px;padding:.2rem .46rem;background:#eef3f8}.status.approved{background:#e5f7ed;color:#14633a}.status.rejected{background:#ffecec;color:#a42626}.actions{display:flex;gap:.4rem;flex-wrap:wrap;margin-top:auto}.actions button{border:0;border-radius:7px;padding:.48rem .6rem;font:inherit;font-size:.7rem;font-weight:800;cursor:pointer;background:#eaf2fb;color:#174d80}.actions .approve{background:#087443;color:#fff}.actions .reject{background:#b42318;color:#fff}.empty{grid-column:1/-1;padding:3rem;text-align:center;color:#687b8d}@media(max-width:900px){.grid{grid-template-columns:1fr 1fr}.form{grid-template-columns:1fr 1fr}.form textarea{grid-column:1/-1}.form button{grid-column:1/-1}.toolbar{grid-template-columns:1fr}}@media(max-width:580px){.grid,.form{grid-template-columns:1fr}.top>div{flex-wrap:wrap}.top h1{width:100%}}
</style></head><body>
<header class="top"><div><h1>🎨 디자인 라이브러리</h1><a href="website-admin.html">제작 사이트 관리</a><a href="admin.html">관리자 화면</a></div></header>
<main class="wrap"><section class="card"><div class="notice"><strong>미리 만들어 검수한 디자인만 학생 제작에 사용합니다.</strong><br>생성 요청 후 AI 실행기가 후보를 만듭니다. 관리자가 승인한 순간부터 신규 학생 신청의 추천 대상에 자동 포함됩니다. 승인 전 후보와 폐기한 후보는 학생에게 사용되지 않습니다.</div>
<div class="form"><select id="jobTrack"><option value="startup">창업용</option><option value="career">취업용</option><option value="both">공통</option></select><input id="jobCount" type="number" min="1" max="12" value="3" aria-label="생성 개수"><textarea id="jobBrief" placeholder="예: 이미지 없이 강한 한글 타이포그래피와 비대칭 에디토리얼 구조. 기존 승인안과 실질적으로 다르게."></textarea><button id="createJob">후보 생성 요청</button></div><p id="jobMessage" class="muted"></p></section>
<section class="card"><div class="stats"><span class="stat">전체 <b id="countAll">0</b></span><span class="stat">검토 대기 <b id="countReview">0</b></span><span class="stat">승인 <b id="countApproved">0</b></span><span class="stat">폐기 <b id="countRejected">0</b></span></div><div class="toolbar"><input id="search" placeholder="이름·콘셉트·태그 검색"><select id="track"><option value="">전체 종류</option><option value="startup">창업</option><option value="career">취업</option><option value="both">공통</option></select><select id="statusFilter"><option value="">전체 상태</option><option value="review">검토 대기</option><option value="approved">승인</option><option value="rejected">폐기</option></select></div><div id="grid" class="grid"><div class="empty">관리자 권한을 확인하고 있습니다.</div></div></section></main>
<script type="module">
import{initializeApp}from'https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js';import{getAuth,onAuthStateChanged}from'https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js';import{getFirestore,collection,getDocs,doc,setDoc,updateDoc,serverTimestamp}from'https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js';
const app=initializeApp({apiKey:'AIzaSyBgZ5pqslhIV7SVTgt3ZSc_ZGGtORM-P-A',authDomain:'pcu-startup.firebaseapp.com',projectId:'pcu-startup',storageBucket:'pcu-startup.firebasestorage.app',messagingSenderId:'47845163622',appId:'1:47845163622:web:789eaef6966e9cf28be3a7'}),db=getFirestore(app),auth=getAuth(app),admins=['jyj2315@gmail.com','bridge0610@pcu.ac.kr'];let items=[];const $=id=>document.getElementById(id),esc=v=>{const e=document.createElement('span');e.textContent=String(v??'');return e.innerHTML},labels={review:'검토 대기',approved:'승인',rejected:'폐기'},tracks={startup:'창업',career:'취업',both:'공통'};
onAuthStateChanged(auth,u=>{if(!u||!admins.includes(u.email||'')){$('grid').innerHTML='<div class="empty">관리자 로그인이 필요합니다. 관리자 화면에서 로그인해주세요.</div>';return}load()});
async function load(){const snap=await getDocs(collection(db,'design_library'));items=snap.docs.map(d=>({id:d.id,...d.data()}));items.sort((a,b)=>(b.createdAt?.seconds||0)-(a.createdAt?.seconds||0));render()}
function render(){const q=$('search').value.trim().toLowerCase(),track=$('track').value,status=$('statusFilter').value;const rows=items.filter(x=>(!track||x.track===track)&&(!status||x.status===status)&&(!q||[x.name,x.concept,...(x.tags||[]),...(x.bestFor||[])].join(' ').toLowerCase().includes(q)));$('countAll').textContent=items.length;$('countReview').textContent=items.filter(x=>x.status==='review').length;$('countApproved').textContent=items.filter(x=>x.status==='approved').length;$('countRejected').textContent=items.filter(x=>x.status==='rejected').length;$('grid').innerHTML=rows.map(x=>{const p=x.designSpec?.palette||{},check=(x.qualityChecklist||[]).slice(0,3).join(' · ');return `<article class="design"><div class="preview" style="--ink:${esc(p.ink||'#172b42')};--paper:${esc(p.paper||'#fff')};--accent:${esc(p.accent||'#009ac9')};--surface:${esc(p.surface||'#eef3f8')}"><small>${esc(tracks[x.track]||x.track)} · V${esc(x.version||1)}</small><h2>${esc(x.name||'이름 없는 디자인')}</h2><p>${esc(x.concept||'콘셉트 설명 없음')}</p><div class="bars"><i></i><i></i><i></i><i></i></div></div><div class="meta"><div><span class="status ${esc(x.status)}">${esc(labels[x.status]||x.status)}</span> <span class="muted">자동검사 ${Number(x.automaticQualityScore||0)}점 · 사용 ${Number(x.usageCount||0)}회</span></div><h3>${esc(x.name)}</h3><div class="tags">${(x.tags||[]).map(t=>`<span class="tag">${esc(t)}</span>`).join('')}</div><p class="muted">적합: ${esc((x.bestFor||[]).join(' · ')||'미지정')}</p><p class="muted">검수: ${esc(check||'검수 기준 미입력')}</p><div class="actions"><button onclick="detail('${x.id}')">실제 HTML 보기</button><button class="approve" onclick="state('${x.id}','approved')">승인</button><button onclick="state('${x.id}','review')">보류</button><button class="reject" onclick="state('${x.id}','rejected')">폐기</button></div></div></article>`}).join('')||'<div class="empty">조건에 맞는 디자인이 없습니다.</div>'}
window.state=async(id,status)=>{const item=items.find(x=>x.id===id);if(!item)return;if(status==='approved'&&!item.previewHtml)return alert('실제 HTML 미리보기가 없는 디자인은 승인할 수 없습니다. 최신 AI 실행기로 다시 생성해주세요.');if(!confirm(`‘${item.name}’을(를) ${labels[status]} 상태로 변경할까요?`))return;await updateDoc(doc(db,'design_library',id),{status,updatedAt:serverTimestamp()});await load()};window.detail=id=>{const x=items.find(v=>v.id===id);if(x?.previewHtml){const blob=new Blob([x.previewHtml],{type:'text/html;charset=utf-8'}),url=URL.createObjectURL(blob),win=open(url,'_blank');if(!win)alert('팝업이 차단되었습니다. 이 사이트의 팝업을 허용해주세요.');setTimeout(()=>URL.revokeObjectURL(url),60000);return}alert(JSON.stringify(x?.designSpec||{},null,2))};
$('createJob').onclick=async()=>{const count=Math.max(1,Math.min(12,Number($('jobCount').value)||1)),id=crypto.randomUUID().replaceAll('-','').slice(0,20);$('createJob').disabled=true;try{await setDoc(doc(db,'design_generation_jobs',id),{status:'pending',track:$('jobTrack').value,count,brief:$('jobBrief').value.trim().slice(0,3000),referenceUrls:[],createdAt:serverTimestamp()});$('jobMessage').textContent=`${count}개 생성 요청을 등록했습니다. AI 실행기가 켜져 있으면 순서대로 처리됩니다.`}catch(e){console.error(e);$('jobMessage').textContent='생성 요청을 등록하지 못했습니다. 관리자 권한과 Firestore 규칙을 확인해주세요.'}finally{$('createJob').disabled=false}};['search','track','statusFilter'].forEach(id=>$(id).addEventListener(id==='search'?'input':'change',render));
</script></body></html>
